<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="D-White-Bear-L">
  <title>D-White-Bear-L</title>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3C3489"/>
      <stop offset="0.5" stop-color="#534AB7"/>
      <stop offset="1" stop-color="#0F6E56"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#534AB7" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <mask id="reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="320">
      <rect x="0" y="0" width="0" height="320" fill="#ffffff">
        <animate attributeName="width" values="0;1200" dur="3.2s" fill="freeze"/>
      </rect>
    </mask>
  </defs>

  <rect width="1200" height="320" rx="18" fill="#FFFFFF"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>

  <!-- bar heights are mapped from the ASCII codes of D-White-Bear-L -->
  <g mask="url(#reveal)">
    <text x="68" y="182" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="56" font-weight="700" letter-spacing="2" fill="url(#ink)">D-White-Bear-L</text>
    <g fill="url(#ink)" opacity="0.78">
      <rect x="660" y="173" width="9" height="77" rx="2"/>
      <rect x="694" y="210" width="9" height="40" rx="2"/>
      <rect x="728" y="143" width="9" height="107" rx="2"/>
      <rect x="762" y="116" width="9" height="134" rx="2"/>
      <rect x="796" y="114" width="9" height="136" rx="2"/>
      <rect x="830" y="96" width="9" height="154" rx="2"/>
      <rect x="864" y="120" width="9" height="130" rx="2"/>
      <rect x="898" y="210" width="9" height="40" rx="2"/>
      <rect x="932" y="176" width="9" height="74" rx="2"/>
      <rect x="966" y="120" width="9" height="130" rx="2"/>
      <rect x="1000" y="127" width="9" height="123" rx="2"/>
      <rect x="1034" y="100" width="9" height="150" rx="2"/>
      <rect x="1068" y="210" width="9" height="40" rx="2"/>
      <rect x="1102" y="160" width="9" height="90" rx="2"/>
    </g>
  </g>

  <rect x="0" y="40" width="2" height="240" fill="#0F6E56" opacity="0.35">
    <animate attributeName="x" values="0;1200" dur="3.2s" fill="freeze"/>
    <animate attributeName="opacity" values="0.35;0.35;0" keyTimes="0;0.85;1" dur="3.2s" fill="freeze"/>
  </rect>

  <rect x="68" y="272" width="1064" height="1" fill="#534AB7" opacity="0.22"/>
  <rect x="1124" y="269" width="8" height="8" rx="2" fill="#0F6E56" opacity="0.8"/>
</svg>
